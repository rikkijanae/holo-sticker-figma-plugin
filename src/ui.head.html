<meta charset="utf-8" />
<style>
  :root{
    --bg: var(--figma-color-bg, #fff);
    --bg2: var(--figma-color-bg-secondary, #f5f5f5);
    --fg: var(--figma-color-text, #1a1a1a);
    --dim: var(--figma-color-text-secondary, #7a7a7a);
    --line: var(--figma-color-border, #e0e0e0);
    --brand: var(--figma-color-bg-brand, #0d99ff);
    --onbrand: var(--figma-color-text-onbrand, #fff);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font:11px/1.4 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--fg); background:var(--bg);
    -webkit-font-smoothing:antialiased; user-select:none;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  .stage{
    flex:0 0 auto; position:relative; height:210px; display:flex; align-items:center; justify-content:center;
    border-bottom:1px solid var(--line); overflow:hidden;
    background-color:var(--bg2);
    background-image:
      linear-gradient(45deg,rgba(128,128,128,.16) 25%,transparent 25%,transparent 75%,rgba(128,128,128,.16) 75%),
      linear-gradient(45deg,rgba(128,128,128,.16) 25%,transparent 25%,transparent 75%,rgba(128,128,128,.16) 75%);
    background-size:14px 14px; background-position:0 0,7px 7px;
  }
  #preview{max-width:calc(100% - 24px); max-height:186px; display:none; image-rendering:auto}
  #hint{position:absolute; color:var(--dim); font-size:11px; text-align:center; padding:0 24px}
  .body{flex:1 1 auto; overflow-y:auto; padding:12px 14px 14px}
  .seg{display:flex; background:var(--bg2); border-radius:6px; padding:2px; gap:2px; margin-bottom:14px}
  .seg button{
    flex:1; border:0; background:transparent; color:var(--dim); font:inherit; font-weight:500;
    padding:6px 0; border-radius:4px; cursor:pointer; white-space:nowrap;
  }
  .seg button.on{background:var(--bg); color:var(--fg); box-shadow:0 1px 2px rgba(0,0,0,.14)}
  .row{display:flex; align-items:center; gap:8px; margin-bottom:9px}
  .row label{flex:0 0 88px; color:var(--dim)}
  .row input[type=range]{flex:1; -webkit-appearance:none; height:16px; background:transparent; cursor:ew-resize}
  .row input[type=range]::-webkit-slider-runnable-track{height:2px; background:var(--line); border-radius:2px}
  .row input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:11px; height:11px; border-radius:50%;
    background:var(--bg); border:1px solid #8a8a8a; margin-top:-4.5px; box-shadow:0 1px 2px rgba(0,0,0,.2);
  }
  .swatches{flex:1; display:flex; gap:4px; transition:opacity .15s}
  .swatches input[type=color]{
    width:30px; height:20px; padding:0; border:1px solid var(--line);
    border-radius:4px; background:none; cursor:pointer;
  }
  .swatches input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
  .swatches input[type=color]::-webkit-color-swatch{border:0; border-radius:2px}
  button.mini{
    flex:0 0 20px; height:20px; padding:0; border:1px solid var(--line); border-radius:4px;
    background:transparent; color:var(--fg); font:inherit; cursor:pointer; line-height:1;
  }
  button.mini:disabled{opacity:.3; cursor:default}
  .row .val{flex:0 0 34px; text-align:right; color:var(--dim); font-variant-numeric:tabular-nums}
  .group{border-top:1px solid var(--line); margin-top:12px; padding-top:11px}
  .ghead{display:flex; align-items:center; gap:7px; margin-bottom:10px; font-weight:600}
  .ghead input{margin:0}
  .collapsed .row{display:none}
  .foot{
    flex:0 0 auto; background:var(--bg); border-top:1px solid var(--line);
    padding:10px 14px; display:flex; align-items:center; gap:10px;
  }
  .foot .meta{flex:1; color:var(--dim)}
  button.primary{
    background:var(--brand); color:var(--onbrand); border:0; border-radius:6px;
    padding:8px 16px; font:inherit; font-weight:600; cursor:pointer;
  }
  button.primary:disabled{opacity:.4; cursor:default}
  button.ghost{
    background:transparent; border:1px solid var(--line); border-radius:6px;
    color:var(--fg); font:inherit; padding:5px 9px; cursor:pointer;
  }
  .err{color:#e5534b; padding:0 14px 8px}
</style>

<div class="stage">
  <canvas id="preview"></canvas>
  <div id="hint">Select a layer on the canvas</div>
</div>

<div class="body">
  <div class="seg" id="preset"></div>
  <div id="mainTop"></div>
  <div class="row">
    <label>Holo colours</label>
    <div class="swatches" id="swatches"></div>
    <button class="mini" id="palMinus" title="Fewer colours">&minus;</button>
    <button class="mini" id="palPlus" title="More colours">+</button>
  </div>
  <div class="row" style="margin-top:-3px">
    <label></label>
    <label for="holoAuto" style="flex:1">
      <input type="checkbox" id="holoAuto" style="margin:0 4px 0 0;vertical-align:-1px">Auto spectrum instead
    </label>
  </div>
  <div id="mainBottom"></div>

  <div class="group" id="g-border">
    <div class="ghead"><input type="checkbox" id="border" checked><label for="border">Die-cut border</label></div>
    <div id="borderRows"></div>
  </div>

  <div class="group collapsed" id="g-shadow">
    <div class="ghead"><input type="checkbox" id="shadow"><label for="shadow">Drop shadow</label></div>
    <div id="shadowRows"></div>
  </div>

  <div class="group">
    <div class="row">
      <label>Resolution</label>
      <select id="res" style="flex:1;font:inherit;padding:3px">
        <option value="2">2x</option>
        <option value="3" selected>3x</option>
        <option value="4">4x</option>
      </select>
      <button class="ghost" id="shuffle">Shuffle</button>
    </div>
    <div class="row" style="margin-bottom:2px">
      <input type="checkbox" id="keep" checked style="margin:0 0 0 2px">
      <label for="keep" style="flex:1">Keep the original layer</label>
    </div>
  </div>
</div>

<div class="err" id="err" style="display:none"></div>

<div class="foot">
  <span class="meta" id="meta"></span>
  <button class="primary" id="apply" disabled>Apply</button>
</div>
