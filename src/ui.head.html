<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1F1F1F; --card:#262626; --line:#333333; --track:#3A3A3A;
    --fg:#EDEDED; --dim:#8C8C8C; --faint:#5A5A5A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font:11px/1.4 Geist,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--fg); background:var(--bg);
    -webkit-font-smoothing:antialiased; user-select:none;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  .mono{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace}

  /* ---- preview ---- */
  .stage{
    flex:0 0 auto; position:relative; height:220px;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    border-bottom:1px solid var(--line);
    background-color:#242424;
    background-image:
      linear-gradient(45deg,#2B2B2B 25%,transparent 25%,transparent 75%,#2B2B2B 75%),
      linear-gradient(45deg,#2B2B2B 25%,transparent 25%,transparent 75%,#2B2B2B 75%);
    background-size:14px 14px; background-position:0 0,7px 7px;
  }
  #preview{max-width:calc(100% - 24px); max-height:196px; display:none}
  #hint{position:absolute; color:var(--dim); text-align:center; padding:0 24px}

  /* ---- controls ---- */
  .body{flex:1 1 auto; overflow-y:auto; padding:12px}
  .body::-webkit-scrollbar{width:6px}
  .body::-webkit-scrollbar-thumb{background:var(--track)}

  .seg{display:flex; border:1px solid var(--line); margin-bottom:12px}
  .seg button{
    flex:1; border:0; border-right:1px solid var(--line); background:transparent;
    color:var(--dim); font:inherit; font-weight:500; padding:7px 0; cursor:pointer;
  }
  .seg button:last-child{border-right:0}
  .seg button.on{background:var(--fg); color:#111}

  .row{display:flex; align-items:center; gap:10px; min-height:24px; margin-bottom:6px}
  .row label{flex:0 0 84px; color:var(--dim)}
  .row .val{flex:0 0 38px; text-align:right; color:var(--dim); font-family:"Geist Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}

  input[type=range]{
    -webkit-appearance:none; appearance:none; flex:1; height:2px; margin:0;
    background:linear-gradient(90deg,var(--fg) 0%,var(--fg) 50%,var(--track) 50%,var(--track) 100%);
    cursor:ew-resize; outline:0;
  }
  input[type=range]::-webkit-slider-runnable-track{height:2px; background:transparent}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:10px; height:10px; border-radius:0; border:0;
    background:var(--fg); margin-top:-4px; cursor:ew-resize;
  }
  input[type=range]:focus-visible::-webkit-slider-thumb{outline:1px solid var(--fg); outline-offset:2px}

  input[type=checkbox]{
    -webkit-appearance:none; appearance:none; width:12px; height:12px; margin:0;
    border:1px solid var(--dim); background:transparent; cursor:pointer; flex:0 0 12px;
    vertical-align:-2px;
  }
  input[type=checkbox]:checked{background:var(--fg); border-color:var(--fg); box-shadow:inset 0 0 0 2px var(--bg)}

  select{
    -webkit-appearance:none; appearance:none; flex:1; background:transparent; color:var(--fg);
    border:0; border-bottom:1px solid var(--line); font:inherit; padding:4px 0; cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
    background-position:calc(100% - 9px) 55%,calc(100% - 5px) 55%; background-size:4px 4px; background-repeat:no-repeat;
  }
  select option{background:var(--card); color:var(--fg)}

  .swatches{flex:1; display:flex; gap:4px; transition:opacity .15s}
  .swatches input[type=color]{
    width:30px; height:18px; padding:0; border:1px solid var(--line); border-radius:0;
    background:none; cursor:pointer;
  }
  .swatches input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
  .swatches input[type=color]::-webkit-color-swatch{border:0; border-radius:0}

  button.mini{
    flex:0 0 18px; height:18px; padding:0; border:1px solid var(--line); border-radius:0;
    background:transparent; color:var(--fg); font:inherit; cursor:pointer; line-height:1;
  }
  button.mini:disabled{opacity:.3; cursor:default}
  button.ghost{
    background:transparent; border:1px solid var(--line); border-radius:0; color:var(--fg);
    font:inherit; padding:4px 9px; cursor:pointer;
  }
  button.ghost:hover, button.mini:not(:disabled):hover{border-color:var(--dim)}

  .group{border-top:1px solid var(--line); margin-top:10px; padding-top:10px}
  .ghead{display:flex; align-items:center; gap:8px; margin-bottom:8px; font-weight:500}
  .ghead label{cursor:pointer}
  .collapsed .row{display:none}

  /* ---- footer ---- */
  .foot{flex:0 0 auto; border-top:1px solid var(--line); padding:12px}
  .foot .actions{display:flex; align-items:center; gap:10px}
  .foot .meta{flex:1; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  button.primary{
    background:var(--fg); color:#111; border:0; border-radius:0;
    padding:8px 18px; font:inherit; font-weight:600; cursor:pointer;
  }
  button.primary:disabled{opacity:.35; cursor:default}
  .credit{
    margin-top:12px; font:8px/1 "Geist Mono",ui-monospace,monospace; letter-spacing:.02em;
    color:var(--faint); text-align:center;
  }
  .credit a{color:var(--faint); text-decoration:underline; text-underline-offset:2px}
  .credit a:hover{color:var(--dim)}
  .err{color:#FF6B6B; padding:0 12px 8px}
</style>

<div class="stage">
  <canvas id="preview"></canvas>
  <div id="hint">Select a layer on the canvas</div>
</div>

<div class="body">
  <div class="seg" id="preset"></div>
  <div id="mainTop"></div>
  <div class="row">
    <label>Holo colours</label>
    <div class="swatches" id="swatches"></div>
    <button class="mini" id="palMinus" title="Fewer colours">&minus;</button>
    <button class="mini" id="palPlus" title="More colours">+</button>
  </div>
  <div class="row" style="margin-top:-2px">
    <label></label>
    <label for="holoAuto" style="flex:1; display:flex; align-items:center; gap:6px; color:var(--fg); cursor:pointer">
      <input type="checkbox" id="holoAuto">Auto spectrum instead
    </label>
  </div>
  <div id="mainBottom"></div>

  <div class="group" id="g-border">
    <div class="ghead"><input type="checkbox" id="border" checked><label for="border">Die-cut border</label></div>
    <div id="borderRows"></div>
  </div>

  <div class="group collapsed" id="g-shadow">
    <div class="ghead"><input type="checkbox" id="shadow"><label for="shadow">Drop shadow</label></div>
    <div id="shadowRows"></div>
  </div>

  <div class="group">
    <div class="row">
      <label>Resolution</label>
      <select id="res">
        <option value="2">2x</option>
        <option value="3" selected>3x</option>
        <option value="4">4x</option>
      </select>
      <button class="ghost" id="shuffle">Shuffle</button>
    </div>
    <div class="row" style="margin-bottom:0">
      <label></label>
      <label for="keep" style="flex:1; display:flex; align-items:center; gap:6px; color:var(--fg); cursor:pointer">
        <input type="checkbox" id="keep" checked>Keep the original layer
      </label>
    </div>
  </div>
</div>

<div class="err" id="err" style="display:none"></div>

<div class="foot">
  <div class="actions">
    <span class="meta" id="meta"></span>
    <button class="primary" id="apply" disabled>Apply</button>
  </div>
  <div class="credit">Vibe Coded by <a href="https://rikkijanae.com" target="_blank" rel="noopener">Rikki Janae</a></div>
</div>
