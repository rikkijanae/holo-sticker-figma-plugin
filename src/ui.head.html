<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Light only. Values are the Light mode of color/panel/* in the Shiny
     Sticker Figma file, which aliases the true-neutral grey/* ramp. Do not
     reach for the site's warm neutral/* tones here.
     Layout follows Plugin Panel / v5: fixed preview, fixed footer, and a
     scrolling middle of white section cards that collapse to a header
     carrying a value summary. */
  :root{
    --bg:#FAFAFA; --card:#FFFFFF; --inset:#FAFAFA;
    --line:#E4E4E4; --line-strong:#D1D1D1; --track:#D1D1D1;
    --fg:#161616; --dim:#545454; --faint:#767676; --inverse:#FFFFFF;
    --action:#161616;
    --r-xs:2px; --r-sm:4px; --r-md:8px;
    --check:rgba(0,0,0,.04);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font:11px/1.4 Geist,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--fg); background:var(--bg);
    -webkit-font-smoothing:antialiased; user-select:none;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  .mono{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace; font-variant-numeric:tabular-nums}

  /* ---- fixed preview ---------------------------------------------------- */
  .stage{
    flex:0 0 190px; position:relative;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    background-color:var(--inset);
    background-image:
      linear-gradient(45deg,var(--check) 25%,transparent 25%,transparent 75%,var(--check) 75%),
      linear-gradient(45deg,var(--check) 25%,transparent 25%,transparent 75%,var(--check) 75%);
    background-size:14px 14px; background-position:0 0,7px 7px;
  }
  #preview{max-width:calc(100% - 32px); max-height:162px; display:none}
  #hint{position:absolute; color:var(--dim); text-align:center; padding:0 28px}

  /* ---- scrolling middle ------------------------------------------------- */
  .body{flex:1 1 auto; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px}
  .body > *{flex:0 0 auto}   /* cards keep their height; the body scrolls */
  .body::-webkit-scrollbar{width:5px}
  .body::-webkit-scrollbar-thumb{background:var(--track); border-radius:var(--r-full,999px)}
  .body::-webkit-scrollbar-track{background:transparent}

  #sections{display:flex; flex-direction:column; gap:8px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r-md)}

  /* preset tabs */
  .seg{display:flex; padding:1px; gap:1px; overflow:hidden}
  .seg button{
    flex:1; border:0; background:transparent; border-radius:6px;
    color:var(--dim); font:inherit; font-weight:500; padding:7px 0; cursor:pointer;
  }
  .seg button:hover{color:var(--fg)}
  .seg button.on{background:var(--action); color:var(--inverse)}

  /* section card */
  .sec{padding:12px 14px}
  .sec > .rows{display:none; padding-top:11px; flex-direction:column; gap:7px}
  .sec.open > .rows{display:flex}

  .shead{display:flex; align-items:center; gap:8px; min-height:15px; cursor:pointer}
  .shead .t{font-weight:500; color:var(--fg)}
  .shead .sum{
    flex:1; text-align:right; color:var(--faint);
    font-family:"Geist Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .chev{
    flex:0 0 7px; width:7px; height:5px; background:var(--faint);
    clip-path:polygon(0 0,100% 0,50% 100%); transition:transform .12s;
  }
  .sec.open .chev{transform:rotate(180deg)}
  /* An open section shows its controls, so the header summary would just be a
     second copy of the same numbers twitching as you drag. */
  .sec.open .shead .sum{visibility:hidden}

  /* slider row: label, track, value box (v5 keeps the number on the right) */
  .row{display:flex; align-items:center; gap:10px; min-height:19px}
  .row > label{flex:0 0 74px; color:var(--dim)}
  .row .valbox{
    flex:0 0 40px; height:19px; border:1px solid var(--line); border-radius:var(--r-sm);
    display:flex; align-items:center; justify-content:center;
    font-family:"Geist Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;
    color:var(--fg); font-size:10px;
  }
  input[type=range]{
    -webkit-appearance:none; appearance:none; flex:1; height:10px; margin:0;
    cursor:ew-resize; outline:0;
    /* No slab behind the slider: the 2px line IS the background-image, painted
       per-frame in the row's sync. background-color must stay transparent —
       background-size only clips the image, never the colour. */
    background-color:transparent; background-size:100% 2px;
    background-position:center; background-repeat:no-repeat;
  }
  input[type=range]::-webkit-slider-runnable-track{height:2px; background:transparent}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:10px; height:10px; border-radius:50%; border:0;
    background:var(--action); margin-top:-4px; cursor:ew-resize;
  }
  input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--action)}
  input[type=range]:disabled{opacity:.4; cursor:default}

  /* checkbox */
  .check{display:flex; align-items:center; gap:7px; color:var(--fg); cursor:pointer}
  input[type=checkbox]{
    -webkit-appearance:none; appearance:none; width:13px; height:13px; margin:0; flex:0 0 13px;
    border:1px solid var(--faint); border-radius:var(--r-xs); background:transparent;
    cursor:pointer; position:relative;
  }
  input[type=checkbox]:checked{background:var(--action); border-color:var(--action)}
  /* A real tick, not an inset hole — the hole read as a filled radio. */
  input[type=checkbox]:checked::after{
    content:''; position:absolute; left:4px; top:1px; width:3px; height:6px;
    border:solid var(--inverse); border-width:0 1.5px 1.5px 0; transform:rotate(43deg);
  }

  /* pill toggle */
  .sw{
    flex:0 0 26px; width:26px; height:14px; border-radius:999px; background:var(--track);
    position:relative; cursor:pointer; transition:background .12s; border:0; padding:0;
  }
  .sw::after{
    content:''; position:absolute; top:2px; left:2px; width:10px; height:10px;
    border-radius:50%; background:#F4F4F4; transition:transform .12s,background .12s;
  }
  .sw.on{background:var(--action)}
  .sw.on::after{transform:translateX(12px); background:var(--inverse)}

  /* holo swatches */
  .palblock{display:flex; flex-direction:column; gap:7px}
  .palhead{display:flex; align-items:center; gap:8px}
  .palhead .t{color:var(--dim)}
  .palhead .n{
    flex:1; text-align:right; color:var(--faint); font-size:8px;
    font-family:"Geist Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;
  }
  .chips{display:flex; gap:8px; margin-top:2px; transition:opacity .15s}
  .chip{flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; gap:5px}
  .well{
    position:relative; width:100%; height:30px; padding:3px;
    border:1px solid var(--line); border-radius:var(--r-sm); background:transparent;
    cursor:pointer; display:block;
  }
  .well .fillcol{width:100%; height:100%; border-radius:var(--r-xs)}
  .well input[type=color]{position:absolute; inset:0; opacity:0; width:100%; height:100%; border:0; padding:0; cursor:pointer}
  /* The cross is drawn, not typed: the \u00d7 glyph sits on the font's math axis,
     which is above the optical centre of a round badge. Two bars centre exactly. */
  .kill{
    position:absolute; top:-7px; right:-7px; width:17px; height:17px; padding:0;
    border-radius:50%; border:2px solid var(--card); background:var(--action);
    cursor:pointer; font-size:0; line-height:0;
  }
  .kill::before, .kill::after{
    content:''; position:absolute; left:50%; top:50%;
    width:7px; height:1.5px; border-radius:1px; background:var(--inverse);
  }
  .kill::before{transform:translate(-50%,-50%) rotate(45deg)}
  .kill::after{transform:translate(-50%,-50%) rotate(-45deg)}
  .kill:hover{background:var(--dim)}
  .chip .hex{font:8px/1 "Geist Mono",ui-monospace,monospace; color:var(--faint); letter-spacing:.02em}
  .chip.add .well{
    border:1px dashed var(--line-strong); display:flex; align-items:center; justify-content:center;
    color:var(--dim); font-size:12px; font-weight:500;
  }
  .chips.auto{opacity:.35; pointer-events:none}
  .chip.add.full{opacity:.35; pointer-events:none}

  /* output */
  .note{color:var(--faint); padding-left:84px; line-height:1.35}
  .segsm{display:flex; gap:4px; flex:1}
  .segsm button{
    flex:1; border:1px solid var(--line); border-radius:var(--r-sm); background:transparent;
    color:var(--dim); font:inherit; padding:4px 0; cursor:pointer;
  }
  .segsm button.on{background:var(--action); border-color:var(--action); color:var(--inverse)}

  /* ---- fixed footer ----------------------------------------------------- */
  .foot{flex:0 0 auto; background:var(--card); border-top:1px solid var(--line); padding:12px}
  .foot .actions{display:flex; align-items:center; gap:10px}
  button.link{
    background:transparent; border:0; padding:0; color:var(--dim); font:inherit;
    text-decoration:underline; text-underline-offset:2px; cursor:pointer;
  }
  button.link:hover{color:var(--fg)}
  button.ghost{
    background:transparent; border:1px solid var(--line); border-radius:var(--r-sm);
    color:var(--fg); font:inherit; padding:4px 10px; cursor:pointer;
  }
  button.ghost:hover{border-color:var(--dim)}
  .foot .spacer{flex:1}
  button.primary{
    background:var(--action); color:var(--inverse); border:0; border-radius:6px;
    padding:8px 18px; font:inherit; font-weight:600; cursor:pointer;
  }
  button.primary:disabled{opacity:.35; cursor:default}
  #meta{
    margin-top:10px; font:8px/1.4 "Geist Mono",ui-monospace,monospace; color:var(--faint);
    text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #meta a{color:var(--faint); text-decoration:underline; text-underline-offset:2px}
  #meta a:hover{color:var(--dim)}
  .err{color:#D93025; background:var(--card); border-top:1px solid var(--line); padding:8px 12px}
</style>

<div class="stage">
  <canvas id="preview"></canvas>
  <div id="hint">Select a layer on the canvas</div>
</div>

<div class="body">
  <div class="card seg" id="preset"></div>
  <div id="sections"></div>
</div>

<div class="err" id="err" style="display:none"></div>

<div class="foot">
  <div class="actions">
    <button class="link" id="reset">Reset</button>
    <button class="ghost" id="shuffle">Shuffle</button>
    <span class="spacer"></span>
    <button class="primary" id="apply" disabled>Apply</button>
  </div>
  <div id="meta">Vibe Coded by <a href="https://rikkijanae.com" target="_blank" rel="noopener">Rikki Janae</a></div>
</div>
