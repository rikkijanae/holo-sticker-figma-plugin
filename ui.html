<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Light only. Values are the Light mode of color/panel/* in the Shiny
     Sticker Figma file, which aliases the true-neutral grey/* ramp. Do not
     reach for the site's warm neutral/* tones here.
     Layout follows Plugin Panel / v5: fixed preview, fixed footer, and a
     scrolling middle of white section cards that collapse to a header
     carrying a value summary. */
  :root{
    --bg:#FAFAFA; --card:#FFFFFF; --inset:#FAFAFA;
    --line:#E4E4E4; --line-strong:#D1D1D1; --track:#D1D1D1;
    --fg:#161616; --dim:#545454; --faint:#767676; --inverse:#FFFFFF;
    --action:#161616;
    --r-xs:2px; --r-sm:4px; --r-md:8px;
    --check:rgba(0,0,0,.04);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font:11px/1.4 Geist,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--fg); background:var(--bg);
    -webkit-font-smoothing:antialiased; user-select:none;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  .mono{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace; font-variant-numeric:tabular-nums}

  /* ---- fixed preview ---------------------------------------------------- */
  .stage{
    flex:0 0 190px; position:relative;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    background-color:var(--inset);
    background-image:
      linear-gradient(45deg,var(--check) 25%,transparent 25%,transparent 75%,var(--check) 75%),
      linear-gradient(45deg,var(--check) 25%,transparent 25%,transparent 75%,var(--check) 75%);
    background-size:14px 14px; background-position:0 0,7px 7px;
  }
  #preview{max-width:calc(100% - 32px); max-height:162px; display:none}
  #hint{position:absolute; color:var(--dim); text-align:center; padding:0 28px}

  /* ---- scrolling middle ------------------------------------------------- */
  .body{flex:1 1 auto; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px}
  .body > *{flex:0 0 auto}   /* cards keep their height; the body scrolls */
  .body::-webkit-scrollbar{width:5px}
  .body::-webkit-scrollbar-thumb{background:var(--track); border-radius:var(--r-full,999px)}
  .body::-webkit-scrollbar-track{background:transparent}

  #sections{display:flex; flex-direction:column; gap:8px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r-md)}

  /* preset tabs */
  .seg{display:flex; padding:1px; gap:1px; overflow:hidden}
  .seg button{
    flex:1; border:0; background:transparent; border-radius:6px;
    color:var(--dim); font:inherit; font-weight:500; padding:7px 0; cursor:pointer;
  }
  .seg button:hover{color:var(--fg)}
  .seg button.on{background:var(--action); color:var(--inverse)}

  /* section card */
  .sec{padding:12px 14px}
  .sec > .rows{display:none; padding-top:11px; flex-direction:column; gap:7px}
  .sec.open > .rows{display:flex}

  .shead{display:flex; align-items:center; gap:8px; min-height:15px; cursor:pointer}
  .shead .t{font-weight:500; color:var(--fg)}
  .shead .sum{
    flex:1; text-align:right; color:var(--faint);
    font-family:"Geist Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .chev{
    flex:0 0 7px; width:7px; height:5px; background:var(--faint);
    clip-path:polygon(0 0,100% 0,50% 100%); transition:transform .12s;
  }
  .sec.open .chev{transform:rotate(180deg)}
  /* An open section shows its controls, so the header summary would just be a
     second copy of the same numbers twitching as you drag. */
  .sec.open .shead .sum{visibility:hidden}

  /* slider row: label, track, value box (v5 keeps the number on the right) */
  .row{display:flex; align-items:center; gap:10px; min-height:19px}
  .row > label{flex:0 0 74px; color:var(--dim)}
  .row .valbox{
    flex:0 0 40px; height:19px; border:1px solid var(--line); border-radius:var(--r-sm);
    display:flex; align-items:center; justify-content:center;
    font-family:"Geist Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;
    color:var(--fg); font-size:10px;
  }
  input[type=range]{
    -webkit-appearance:none; appearance:none; flex:1; height:10px; margin:0;
    cursor:ew-resize; outline:0;
    /* No slab behind the slider: the 2px line IS the background-image, painted
       per-frame in the row's sync. background-color must stay transparent —
       background-size only clips the image, never the colour. */
    background-color:transparent; background-size:100% 2px;
    background-position:center; background-repeat:no-repeat;
  }
  input[type=range]::-webkit-slider-runnable-track{height:2px; background:transparent}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:10px; height:10px; border-radius:50%; border:0;
    background:var(--action); margin-top:-4px; cursor:ew-resize;
  }
  input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--action)}
  input[type=range]:disabled{opacity:.4; cursor:default}

  /* checkbox */
  .check{display:flex; align-items:center; gap:7px; color:var(--fg); cursor:pointer}
  input[type=checkbox]{
    -webkit-appearance:none; appearance:none; width:13px; height:13px; margin:0; flex:0 0 13px;
    border:1px solid var(--faint); border-radius:var(--r-xs); background:transparent;
    cursor:pointer; position:relative;
  }
  input[type=checkbox]:checked{background:var(--action); border-color:var(--action)}
  /* A real tick, not an inset hole — the hole read as a filled radio. */
  input[type=checkbox]:checked::after{
    content:''; position:absolute; left:4px; top:1px; width:3px; height:6px;
    border:solid var(--inverse); border-width:0 1.5px 1.5px 0; transform:rotate(43deg);
  }

  /* pill toggle */
  .sw{
    flex:0 0 26px; width:26px; height:14px; border-radius:999px; background:var(--track);
    position:relative; cursor:pointer; transition:background .12s; border:0; padding:0;
  }
  .sw::after{
    content:''; position:absolute; top:2px; left:2px; width:10px; height:10px;
    border-radius:50%; background:#F4F4F4; transition:transform .12s,background .12s;
  }
  .sw.on{background:var(--action)}
  .sw.on::after{transform:translateX(12px); background:var(--inverse)}

  /* holo swatches */
  .palblock{display:flex; flex-direction:column; gap:7px}
  .palhead{display:flex; align-items:center; gap:8px}
  .palhead .t{color:var(--dim)}
  .palhead .n{
    flex:1; text-align:right; color:var(--faint); font-size:8px;
    font-family:"Geist Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;
  }
  .chips{display:flex; gap:8px; margin-top:2px; transition:opacity .15s}
  .chip{flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; gap:5px}
  .well{
    position:relative; width:100%; height:30px; padding:3px;
    border:1px solid var(--line); border-radius:var(--r-sm); background:transparent;
    cursor:pointer; display:block;
  }
  .well .fillcol{width:100%; height:100%; border-radius:var(--r-xs)}
  .well input[type=color]{position:absolute; inset:0; opacity:0; width:100%; height:100%; border:0; padding:0; cursor:pointer}
  /* The cross is drawn, not typed: the \u00d7 glyph sits on the font's math axis,
     which is above the optical centre of a round badge. Two bars centre exactly. */
  .kill{
    position:absolute; top:-7px; right:-7px; width:17px; height:17px; padding:0;
    border-radius:50%; border:2px solid var(--card); background:var(--action);
    cursor:pointer; font-size:0; line-height:0;
  }
  .kill::before, .kill::after{
    content:''; position:absolute; left:50%; top:50%;
    width:7px; height:1.5px; border-radius:1px; background:var(--inverse);
  }
  .kill::before{transform:translate(-50%,-50%) rotate(45deg)}
  .kill::after{transform:translate(-50%,-50%) rotate(-45deg)}
  .kill:hover{background:var(--dim)}
  .chip .hex{font:8px/1 "Geist Mono",ui-monospace,monospace; color:var(--faint); letter-spacing:.02em}
  .chip.add .well{
    border:1px dashed var(--line-strong); display:flex; align-items:center; justify-content:center;
    color:var(--dim); font-size:12px; font-weight:500;
  }
  .chips.auto{opacity:.35; pointer-events:none}
  .chip.add.full{opacity:.35; pointer-events:none}

  /* output */
  .note{color:var(--faint); padding-left:84px; line-height:1.35}
  .segsm{display:flex; gap:4px; flex:1}
  .segsm button{
    flex:1; border:1px solid var(--line); border-radius:var(--r-sm); background:transparent;
    color:var(--dim); font:inherit; padding:4px 0; cursor:pointer;
  }
  .segsm button.on{background:var(--action); border-color:var(--action); color:var(--inverse)}

  /* ---- fixed footer ----------------------------------------------------- */
  .foot{flex:0 0 auto; background:var(--card); border-top:1px solid var(--line); padding:12px}
  .foot .actions{display:flex; align-items:center; gap:10px}
  button.link{
    background:transparent; border:0; padding:0; color:var(--dim); font:inherit;
    text-decoration:underline; text-underline-offset:2px; cursor:pointer;
  }
  button.link:hover{color:var(--fg)}
  button.ghost{
    background:transparent; border:1px solid var(--line); border-radius:var(--r-sm);
    color:var(--fg); font:inherit; padding:4px 10px; cursor:pointer;
  }
  button.ghost:hover{border-color:var(--dim)}
  .foot .spacer{flex:1}
  button.primary{
    background:var(--action); color:var(--inverse); border:0; border-radius:6px;
    padding:8px 18px; font:inherit; font-weight:600; cursor:pointer;
  }
  button.primary:disabled{opacity:.35; cursor:default}
  #meta{
    margin-top:10px; font:8px/1.4 "Geist Mono",ui-monospace,monospace; color:var(--faint);
    text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #meta a{color:var(--faint); text-decoration:underline; text-underline-offset:2px}
  #meta a:hover{color:var(--dim)}
  .err{color:#D93025; background:var(--card); border-top:1px solid var(--line); padding:8px 12px}
</style>

<div class="stage">
  <canvas id="preview"></canvas>
  <div id="hint">Select a layer on the canvas</div>
</div>

<div class="body">
  <div class="card seg" id="preset"></div>
  <div id="sections"></div>
</div>

<div class="err" id="err" style="display:none"></div>

<div class="foot">
  <div class="actions">
    <button class="link" id="reset">Reset</button>
    <button class="ghost" id="shuffle">Shuffle</button>
    <span class="spacer"></span>
    <button class="primary" id="apply" disabled>Apply</button>
  </div>
  <div id="meta">Vibe Coded by <a href="https://rikkijanae.com" target="_blank" rel="noopener">Rikki Janae</a></div>
</div>

<script>
/* ------------------------------------------------------------------
   Shiny Sticker — WebGL pipeline.
   Two passes:
     1. sdf       : distance-to-nearest-opaque-pixel, quarter res. Cached —
                    only re-runs when the source or the padding changes.
     2. composite : shadow -> die-cut border -> artwork + flake mosaic
   Everything is authored in "design px" (output px / exportScale) so the
   flake size stays constant whatever resolution you export at.

   Coordinate convention: vUV is TOP-DOWN (0,0 = top-left) so it matches
   image space. The SDF is a render target whose rows run bottom-up, so it
   is read back through sdfUV(). Don't undo either half without the other.
------------------------------------------------------------------- */

const VERT = `
attribute vec2 aPos;
varying vec2 vUV;
void main(){ vUV = vec2(aPos.x * 0.5 + 0.5, 0.5 - aPos.y * 0.5); gl_Position = vec4(aPos, 0.0, 1.0); }
`;

const COMMON = `
precision highp float;
varying vec2 vUV;
uniform sampler2D uSrc;
uniform vec2 uOutSize;
uniform vec2 uPad;
uniform vec2 uSrcSize;
uniform float uMaxDist;

float sampleA(vec2 px){
  vec2 uv = (px - uPad) / uSrcSize;
  if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) return 0.0;
  return texture2D(uSrc, uv).a;
}
`;

/* ---- pass 1: coarse ring search + local refine -> normalised distance ---- */
const FRAG_SDF = COMMON + `
void main(){
  vec2 px = vUV * uOutSize;
  float d = uMaxDist;

  if (sampleA(px) > 0.5) {
    d = 0.0;
  } else {
    float coarse = uMaxDist;
    for (int r = 1; r <= 12; r++){
      float rad = uMaxDist * float(r) / 12.0;
      for (int t = 0; t < 16; t++){
        float ang = 6.2831853 * float(t) / 16.0 + float(r) * 0.61;
        if (sampleA(px + rad * vec2(cos(ang), sin(ang))) > 0.5) coarse = min(coarse, rad);
      }
    }
    d = coarse;
    float lo = max(0.0, coarse - uMaxDist / 12.0);
    for (int k = 1; k < 8; k++){
      float rad = lo + (coarse - lo) * float(k) / 8.0;
      for (int t = 0; t < 16; t++){
        float ang = 6.2831853 * float(t) / 16.0 + float(k) * 1.13;
        if (sampleA(px + rad * vec2(cos(ang), sin(ang))) > 0.5) d = min(d, rad);
      }
    }
  }
  gl_FragColor = vec4(d / uMaxDist, 0.0, 0.0, 1.0);
}
`;

/* ---- pass 2: the actual look ---- */
const FRAG_COMPOSITE = COMMON + `
uniform sampler2D uSDF;
uniform float uScale;
uniform int   uMode;
uniform float uIntensity;
uniform float uFlakeScale;
uniform float uSpread;
uniform float uSparkle;
uniform float uAngle;
uniform float uSeed;
uniform float uGloss;
uniform float uTint;
uniform float uHoloMix;
uniform float uHoloAuto;
uniform float uHoloLift;
uniform float uHoloN;
uniform vec3  uHoloPal0;
uniform vec3  uHoloPal1;
uniform vec3  uHoloPal2;
uniform vec3  uHoloPal3;
uniform vec3  uHoloPal4;
uniform vec3  uHoloPal5;
uniform float uColorVary;
uniform float uJitter;
uniform float uCover;
uniform float uVary;
uniform float uBorder;
uniform float uBorderW;
uniform float uBorderHolo;
uniform float uShadow;
uniform float uShadowBlur;
uniform float uShadowOpacity;
uniform vec2  uShadowOff;

const vec3 LUMA = vec3(0.299, 0.587, 0.114);

float hash12(vec2 p){
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
vec2 hash22(vec2 p){
  vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.xx + p3.yz) * p3.zy);
}

// Cosine palette — full spectrum, no muddy midpoints.
vec3 pal(float t){
  return 0.5 + 0.5 * cos(6.28318 * (t + vec3(0.00, 0.33, 0.67)));
}

vec3 rgb2hsv(vec3 c){
  vec4 K = vec4(0.0, -1.0 / 3.0, 2.0 / 3.0, -1.0);
  vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g));
  vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r));
  float d = q.x - min(q.w, q.y);
  return vec3(abs(q.z + (q.w - q.y) / (6.0 * d + 1e-10)), d / (q.x + 1e-10), q.x);
}
vec3 hsv2rgb(vec3 c){
  vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
  vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
  return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
}

vec3 hardLight(vec3 b, vec3 s){
  return mix(2.0 * b * s, 1.0 - 2.0 * (1.0 - b) * (1.0 - s), step(vec3(0.5), s));
}

// solid = how much the flake occludes the ink rather than interacting with it.
vec3 layFlake(vec3 b, vec3 s, float solid){
  return mix(mix(hardLight(b, s), mix(b, s, 0.45), 0.26), s, solid);
}

// The user's palette for the holo flashes: each flake picks one at random.
vec3 pickPal(float r){
  float k = r * uHoloN;
  vec3 c = uHoloPal0;
  if (k > 1.0) c = uHoloPal1;
  if (k > 2.0) c = uHoloPal2;
  if (k > 3.0) c = uHoloPal3;
  if (k > 4.0) c = uHoloPal4;
  if (k > 5.0) c = uHoloPal5;
  return c;
}

float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash12(i);
  float b = hash12(i + vec2(1.0, 0.0));
  float c = hash12(i + vec2(0.0, 1.0));
  float dd = hash12(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, dd, f.x), f.y);
}
float fbm(vec2 p){
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++){ s += a * vnoise(p); p *= 2.03; a *= 0.5; }
  return s;
}

/* One layer of overlapping metallic discs — a full mosaic, no gaps.
   Returns rgb + coverage, plus specular and per-pixel holo coverage.

   tintAmt 0 = pure spectral holo.
   tintAmt 1 = each disc takes the colour of the artwork under its centre,
               drifted by uColorVary, with uHoloMix of them as flashes in
               either the auto spectrum or the user's palette.             */
vec4 flakes(vec2 pd, float cell, float rMin, float rMax, float soft, float salt,
            float tintAmt, vec3 fallback, out float spec, out float holoCov){
  float cs = max(cell, 0.5);
  vec2 gp = pd / cs;
  vec2 g = floor(gp), f = fract(gp);
  vec3 col = vec3(0.0);
  float cov = 0.0;
  spec = 0.0;
  holoCov = 0.0;
  float sd = uSeed + salt;
  vec2 ldir = vec2(cos(uAngle), sin(uAngle));
  float sweep = dot(pd, ldir) * 0.0026;

  // Two z-tiers, so overlapping discs don't all stack in one diagonal
  // direction — the mosaic boundaries come out random, like a real sheet.
  for (int tier = 0; tier < 2; tier++){
    for (int j = -1; j <= 1; j++){
      for (int i = -1; i <= 1; i++){
        vec2 o = vec2(float(i), float(j));
        vec2 id = g + o;
        float z = hash12(id + sd + 61.7);
        if (tier == 0 && z >= 0.5) continue;
        if (tier == 1 && z <  0.5) continue;

        vec2 h = hash22(id + sd);
        vec2 c = o + 0.5 + (h - 0.5) * uJitter;
        float rad = mix(rMin, rMax, hash12(id + sd + 11.3)) * uCover;
        float dd = length(f - c);
        float m = smoothstep(rad, rad * soft, dd);
        m *= 1.0 - uVary * hash12(id + sd + 17.1);
        if (m <= 0.001) continue;

        float b = hash12(id + sd + 8.9);
        // each disc catches the light from one side, like a real sequin
        float lit = 0.5 + 0.5 * dot(normalize(f - c + 1e-4), ldir);

        float hue = hash12(id + sd + 3.7);
        vec3 rainbow = clamp(pal(hue * uSpread + sweep)
                             * (0.62 + 0.5 * b) * (0.78 + 0.44 * lit), 0.0, 1.0);
        vec3 fc = rainbow;
        float thisHolo = 0.0;

        if (tintAmt > 0.001){
          // sample the artwork at the disc's CENTRE — the whole flake is one
          // colour, a sequin on the ink rather than a filter over it
          vec2 cuv = ((g + c) * cs * uScale - uPad) / uSrcSize;
          vec4 os = vec4(0.0);
          if (cuv.x >= 0.0 && cuv.x <= 1.0 && cuv.y >= 0.0 && cuv.y <= 1.0) os = texture2D(uSrc, cuv);
          vec3 objc = mix(fallback, os.rgb, step(0.35, os.a));

          float ol = dot(objc, LUMA);
          vec3 sat = clamp(mix(vec3(ol), objc, 1.35), 0.0, 1.0);

          // per-flake drift around the object's own hue
          vec3 hsv = rgb2hsv(sat);
          hsv.x = fract(hsv.x + (hash12(id + sd + 41.3) - 0.5) * 0.20 * uColorVary);
          hsv.y = clamp(hsv.y * (1.0 - 0.6 * uColorVary * hash12(id + sd + 43.7))
                        + 0.10 * uColorVary * hash12(id + sd + 47.9), 0.0, 1.0);
          vec3 objV = hsv2rgb(hsv);

          // target lightness for this facet: anchored to the object, with a
          // floor so dark ink still throws visible flashes
          float facet = (0.55 + 0.95 * b) * (0.84 + 0.32 * lit);
          float fLum = clamp(ol * facet + (1.0 - ol) * 0.20 * b * b, 0.0, 1.0);
          vec3 tinted = clamp(objV * (fLum / max(dot(objV, LUMA), 0.02)), 0.0, 1.0);

          // the flashes: auto spectrum, or one of the user's palette colours,
          // recoloured AT THAT SAME LIGHTNESS so a black sticker stays black
          vec3 holoBase = mix(pickPal(hash12(id + sd + 71.3)), rainbow, uHoloAuto);
          vec3 hb = rgb2hsv(holoBase);
          hb.x = fract(hb.x + (hash12(id + sd + 51.1) - 0.5) * 0.14 * uColorVary);
          hb.y = clamp(hb.y * (1.0 - 0.35 * uColorVary * hash12(id + sd + 53.3)), 0.0, 1.0);
          holoBase = hsv2rgb(hb);
          vec3 iri = clamp(holoBase * (fLum / max(dot(holoBase, LUMA), 0.03)) * uHoloLift, 0.0, 1.0);
          tinted = mix(tinted, iri, 0.12);

          // in auto mode dark ink keeps its flashes near-monochrome like real
          // film; a hand-picked palette is left alone
          float chromaOK = mix(1.0, 0.3 + 0.7 * sqrt(clamp(ol * 1.6, 0.0, 1.0)), uHoloAuto);
          float isHolo = step(1.0 - uHoloMix, hash12(id + sd + 21.7));
          vec3 holoCol = mix(iri, vec3(fLum * 1.15 * uHoloLift),
                             mix(0.16, 0.35, uHoloAuto) * hash12(id + sd + 27.3));
          holoCol = mix(vec3(dot(holoCol, vec3(0.333))), holoCol, chromaOK);

          fc = mix(mix(rainbow, tinted, tintAmt), clamp(holoCol, 0.0, 1.0), isHolo * tintAmt);
          thisHolo = isHolo * tintAmt;
        }

        float sp = pow(hash12(id + sd + 5.1), 5.0) * (0.35 + 0.65 * lit);
        col = mix(col, fc, m);
        holoCov = mix(holoCov, thisHolo, m);
        cov = max(cov, m);
        spec = max(spec, sp * m);
      }
    }
  }
  return vec4(col, cov);
}

// Oil-slick foil: domain-warped fbm driving the palette.
vec4 foil(vec2 pd, out float spec){
  vec2 q = pd / max(150.0 * uFlakeScale, 1.0);
  vec2 w = vec2(fbm(q * 1.7 + uSeed + 3.1), fbm(q * 1.7 + uSeed + 7.7));
  float n = fbm(q + w * 1.1 + uSeed);
  float sweep = dot(pd, vec2(cos(uAngle), sin(uAngle))) * 0.0018;
  vec3 col = pal(n * 2.6 * uSpread + sweep);
  spec = pow(clamp((n - 0.45) * 3.0, 0.0, 1.0), 3.0);
  return vec4(col, 1.0);
}

// The SDF is a render target — its rows run bottom-up while vUV is top-down.
vec2 sdfUV(vec2 uv){ return vec2(uv.x, 1.0 - uv.y); }

vec4 over(vec4 s, vec4 d){
  float a = s.a + d.a * (1.0 - s.a);
  vec3 c = (s.rgb * s.a + d.rgb * d.a * (1.0 - s.a)) / max(a, 1e-5);
  return vec4(c, a);
}

void main(){
  vec2 px = vUV * uOutSize;
  vec2 pd = px / uScale;

  vec2 suv = (px - uPad) / uSrcSize;
  vec4 src = vec4(0.0);
  if (suv.x >= 0.0 && suv.x <= 1.0 && suv.y >= 0.0 && suv.y <= 1.0) src = texture2D(uSrc, suv);

  float d = texture2D(uSDF, sdfUV(vUV)).r * uMaxDist;
  float bw = uBorderW * uScale;

  // ---- artwork + flake mosaic ----------------------------------------
  vec4 artL = vec4(0.0);
  if (src.a > 0.002){
    float sp1 = 0.0, sp2 = 0.0, hc1 = 0.0, hc2 = 0.0;
    vec4 fl = vec4(0.0), fl2 = vec4(0.0);
    if (uMode == 0) {                       // sequin confetti — one even layer
      fl  = flakes(pd, 10.5 * uFlakeScale, 0.64, 0.78, 0.94,  0.0, uTint, src.rgb, sp1, hc1);
    } else if (uMode == 1) {                // fine glitter dust
      fl  = flakes(pd,  4.6 * uFlakeScale, 0.60, 0.76, 0.80,  0.0, uTint, src.rgb, sp1, hc1);
      fl2 = flakes(pd,  2.1 * uFlakeScale, 0.44, 0.62, 0.66, 31.7, uTint, src.rgb, sp2, hc2);
    } else {                                // prismatic foil
      fl  = foil(pd, sp1);
      // Object tint is hidden on the Foil tab (Rikki, 2026-09-09) and the Foil
      // preset pins uTint to 0, so this branch is unreachable from the panel.
      // Kept because it is correct and one line in HIDDEN brings it back.
      if (uTint > 0.001) {
        // Tint must COLOUR the foil, not erase it. The old version keyed off
        // the foil's luminance, which pal() keeps nearly flat — the swirl lives
        // in the hue — so tinting collapsed to a flat wash of the artwork.
        // Instead: keep the foil's light/dark as a modulation of the artwork's
        // own lightness (same luminance matching the flake path uses, so a
        // black sticker stays black), take hue and saturation from the artwork,
        // and leave a narrow hue swing so it still reads as iridescent.
        vec3  oh = rgb2hsv(src.rgb);
        vec3  fh = rgb2hsv(fl.rgb);
        float ol = dot(src.rgb, LUMA);
        float f  = fh.z;

        // Lightness is ALWAYS matched to the artwork, whatever the hue does —
        // that is what keeps a black sticker black. Do not let the hue blend
        // below feed back into L, or neutrals bleach out (the old chroma-gate
        // bug in the flake path).
        float L = clamp(ol * (0.55 + 0.9 * f) + (1.0 - ol) * 0.28 * f * f, 0.0, 1.0);

        // A coloured artwork lends its own hue; a neutral one (black, white,
        // grey) has no hue to lend, so the foil keeps a muted version of its
        // own. Black holo foil is dark AND iridescent, not flat black.
        float w = clamp(oh.y * 2.2, 0.0, 1.0);
        float hue = mix(fh.x, fract(oh.x + (fh.x - 0.5) * 0.16), w);
        float sat = mix(fh.y * 0.55, oh.y * (0.85 + 0.30 * f), w);

        vec3 tf = hsv2rgb(vec3(hue, clamp(sat, 0.0, 1.0), L));
        fl.rgb = mix(fl.rgb, tf, uTint);
      }
    }

    // Keep the mosaic off the artwork's antialiased rim. Without this the
    // flakes are laid at full strength on half-transparent edge pixels, which
    // then composite over the die-cut and read as colour leaking past it.
    // Genuinely translucent artwork (a 50%-opacity layer) still gets ~0.9.
    float core = smoothstep(0.06, 0.62, src.a);

    vec3 art = mix(src.rgb, src.rgb * 0.9 + 0.07, 0.3);   // gentle plastic lift

    // base diffraction sheen — fades out entirely as Object tint comes up
    float band = dot(pd, vec2(cos(uAngle), sin(uAngle))) * 0.004 * uSpread;
    vec3 sheen = mix(vec3(0.5), pal(band + 0.1), 0.85);
    art = mix(art, hardLight(art, sheen), 0.19 * uIntensity * (1.0 - uTint));

    // the mosaic. Shimmer scales how solidly it covers the ink.
    float solidity = mix(0.75, 0.30, uHoloAuto);
    // Foil composites straight in proportion to tint. layFlake at solid = 0 is
    // essentially hard-light, and hard-light can never lift a black base, so a
    // black sticker showed no tinted foil at all. The tinted colour is already
    // luminance-matched, so laying it straight is both correct and visible.
    float solid1 = (uMode == 2) ? uTint * 0.92 : hc1 * solidity;
    float a1 = clamp(fl.a * uIntensity * 0.78, 0.0, 1.0) * core;
    art = mix(art, layFlake(art, fl.rgb, solid1), a1);
    float a2 = clamp(fl2.a * uIntensity * 0.6, 0.0, 1.0) * core;
    art = mix(art, layFlake(art, fl2.rgb, hc2 * solidity), a2);

    // flakes catch the most light where the ink is dark (rainbow mode only)
    float luma = dot(src.rgb, LUMA);
    art += (fl.rgb * a1 + fl2.rgb * a2 * 0.6) * (1.0 - luma) * 0.28 * uIntensity * (1.0 - 0.8 * uTint);
    art += (sp1 * a1 + sp2 * a2 * 0.6) * uSparkle * 0.95;

    float gloss = smoothstep(1.0, 0.05, length(vUV - vec2(0.32, 0.24)) * 1.55);
    art += gloss * 0.10 * uGloss;

    artL = vec4(clamp(art, 0.0, 1.0), src.a);
  }

  // ---- die-cut border (only evaluated where it can show) ---------------
  vec4 borderL = vec4(1.0, 1.0, 1.0, 0.0);
  if (uBorder > 0.5 && src.a < 0.995){
    float borderMask = 1.0 - smoothstep(bw - 1.2, bw + 1.2, d);
    if (borderMask > 0.001){
      vec3 bcol = vec3(0.985);
      if (uBorderHolo > 0.002){
        float bsp = 0.0, bhc = 0.0;
        vec4 bf = flakes(pd, 7.0 * uFlakeScale, 0.62, 0.76, 0.85, 5.3, 0.0, vec3(0.9), bsp, bhc);
        vec3 bfc = mix(vec3(dot(bf.rgb, vec3(0.333))), bf.rgb, 0.16);
        vec3 silver = layFlake(vec3(0.9), mix(vec3(0.88), bfc, bf.a * 0.5), 0.0);
        bcol = mix(bcol, clamp(silver + bsp * 0.4, 0.0, 1.0), uBorderHolo);
      }
      borderL = vec4(bcol, borderMask);
    }
  }

  // ---- drop shadow -------------------------------------------------------
  float shA = 0.0;
  if (uShadow > 0.5){
    vec2 off = uShadowOff * uScale;
    vec2 s2 = (px - off) / uOutSize;
    float d2 = uMaxDist;
    if (s2.x >= 0.0 && s2.x <= 1.0 && s2.y >= 0.0 && s2.y <= 1.0) d2 = texture2D(uSDF, sdfUV(s2)).r * uMaxDist;
    float edge = (uBorder > 0.5) ? bw : 0.0;
    shA = (1.0 - smoothstep(edge, edge + max(uShadowBlur * uScale, 1.0), d2)) * uShadowOpacity;
  }
  vec4 shadowL = vec4(vec3(0.02, 0.02, 0.06), shA);

  vec4 res = shadowL;
  res = over(borderL, res);
  res = over(artL, res);
  gl_FragColor = res;
}
`;

/* ------------------------------------------------------------------ */

function compile(gl, type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(s) + '\n' + src);
  }
  return s;
}

function program(gl, frag) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl, gl.VERTEX_SHADER, VERT));
  gl.attachShader(p, compile(gl, gl.FRAGMENT_SHADER, frag));
  gl.bindAttribLocation(p, 0, 'aPos');
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

class HoloRenderer {
  constructor(canvas) {
    this.canvas = canvas;
    const gl = canvas.getContext('webgl', {
      premultipliedAlpha: false,
      preserveDrawingBuffer: true,
      antialias: false,
      alpha: true
    });
    if (!gl) throw new Error('WebGL is unavailable in this window.');
    this.gl = gl;

    this.pSDF = program(gl, FRAG_SDF);
    this.pComp = program(gl, FRAG_COMPOSITE);
    this._loc = new Map();

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

    this.srcTex = gl.createTexture();
    this.sdfTex = gl.createTexture();
    this.fbo = gl.createFramebuffer();
    [this.srcTex, this.sdfTex].forEach((t) => {
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    });
    this._gen = 0;
    this._sdfKey = null;
  }

  setSource(bitmap) {
    const gl = this.gl;
    this.srcW = bitmap.width;
    this.srcH = bitmap.height;
    gl.bindTexture(gl.TEXTURE_2D, this.srcTex);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, bitmap);
    this._gen++;
  }

  _u(P, name) {
    const key = P === this.pSDF ? 's:' + name : 'c:' + name;
    let l = this._loc.get(key);
    if (l === undefined) { l = this.gl.getUniformLocation(P, name); this._loc.set(key, l); }
    return l;
  }

  /**
   * k — render scale factor (1 = full res, <1 = preview)
   * o — options, all sizes in design px
   */
  render(o, k) {
    const gl = this.gl;
    const scale = o.exportScale * k;
    const padOut = Math.ceil(o.pad * scale);
    const maxDist = Math.max(padOut, 6);
    const srcW = this.srcW * k;
    const srcH = this.srcH * k;
    const outW = Math.max(2, Math.round(srcW + padOut * 2));
    const outH = Math.max(2, Math.round(srcH + padOut * 2));

    // --- pass 1: SDF at quarter res, cached across slider drags ----
    const sw = Math.max(2, Math.ceil(outW / 4));
    const sh = Math.max(2, Math.ceil(outH / 4));
    const key = [this._gen, outW, outH, padOut, maxDist].join(':');
    if (key !== this._sdfKey) {
      gl.bindTexture(gl.TEXTURE_2D, this.sdfTex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, sw, sh, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
      gl.bindFramebuffer(gl.FRAMEBUFFER, this.fbo);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, this.sdfTex, 0);
      gl.viewport(0, 0, sw, sh);
      gl.useProgram(this.pSDF);
      this._common(this.pSDF, outW, outH, padOut, srcW, srcH, maxDist);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, this.srcTex);
      gl.uniform1i(this._u(this.pSDF, 'uSrc'), 0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      this._sdfKey = key;
    }

    // --- pass 2: composite to the canvas --------------------------
    this.canvas.width = outW;
    this.canvas.height = outH;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, outW, outH);
    gl.useProgram(this.pComp);
    const P = this.pComp;
    this._common(P, outW, outH, padOut, srcW, srcH, maxDist);
    const u = (n) => this._u(P, n);
    gl.uniform1f(u('uScale'), scale);
    gl.uniform1i(u('uMode'), o.mode);
    gl.uniform1f(u('uIntensity'), o.intensity);
    gl.uniform1f(u('uFlakeScale'), o.flakeScale);
    gl.uniform1f(u('uSpread'), o.spread);
    gl.uniform1f(u('uSparkle'), o.sparkle);
    gl.uniform1f(u('uAngle'), (o.angle * Math.PI) / 180);
    gl.uniform1f(u('uSeed'), o.seed);
    gl.uniform1f(u('uGloss'), o.gloss);
    gl.uniform1f(u('uTint'), o.tint);
    gl.uniform1f(u('uHoloMix'), o.holoMix);
    gl.uniform1f(u('uHoloAuto'), o.holoAuto ? 1 : 0);
    gl.uniform1f(u('uHoloLift'), o.holoLift);
    const pal = o.holoPal && o.holoPal.length ? o.holoPal : [[0.93, 0.92, 0.96]];
    gl.uniform1f(u('uHoloN'), pal.length);
    for (let i = 0; i < 6; i++) {
      const c = pal[Math.min(i, pal.length - 1)];
      gl.uniform3f(u('uHoloPal' + i), c[0], c[1], c[2]);
    }
    gl.uniform1f(u('uColorVary'), o.colorVary);
    gl.uniform1f(u('uJitter'), o.jitter);
    gl.uniform1f(u('uCover'), o.cover);
    gl.uniform1f(u('uVary'), o.vary);
    gl.uniform1f(u('uBorder'), o.border ? 1 : 0);
    gl.uniform1f(u('uBorderW'), o.borderW);
    gl.uniform1f(u('uBorderHolo'), o.borderHolo);
    gl.uniform1f(u('uShadow'), o.shadow ? 1 : 0);
    gl.uniform1f(u('uShadowBlur'), o.shadowBlur);
    gl.uniform1f(u('uShadowOpacity'), o.shadowOpacity);
    gl.uniform2f(u('uShadowOff'), o.shadowX, o.shadowY);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.srcTex);
    gl.uniform1i(u('uSrc'), 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, this.sdfTex);
    gl.uniform1i(u('uSDF'), 1);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    return { width: outW, height: outH, padOut: padOut, scale: scale };
  }

  _common(P, outW, outH, pad, srcW, srcH, maxDist) {
    const gl = this.gl;
    gl.uniform2f(this._u(P, 'uOutSize'), outW, outH);
    gl.uniform2f(this._u(P, 'uPad'), pad, pad);
    gl.uniform2f(this._u(P, 'uSrcSize'), srcW, srcH);
    gl.uniform1f(this._u(P, 'uMaxDist'), maxDist);
  }
}


</script>

  },

  { id: 'texture', title: 'Texture',        open: false, fields: ['flakeScale', 'spread', 'cover', 'jitter'] },
  { id: 'light',   title: 'Light',          open: false, fields: ['holoLift', 'sparkle', 'angle', 'gloss'] },
  { id: 'border',  title: 'Die-cut border', open: false, fields: ['borderW', 'borderHolo'], toggle: 'border', brief: ['borderW'] },
  { id: 'shadow',  title: 'Drop shadow',    open: false, fields: ['shadowBlur', 'shadowOpacity', 'shadowX', 'shadowY'], toggle: 'shadow', brief: ['shadowBlur', 'shadowOpacity'] },

function fmt(key) {

  const head = document.createElement('div');
  head.className = 'shead';
  head.innerHTML = '<span class="t"></span><span class="sum"></span>';
  const title = head.querySelector('.t');
  title.textContent = sec.title;
  card.appendChild(head);

  const rows = document.createElement('div');
  rows.className = 'rows';
  card.appendChild(rows);
  host.appendChild(card);          // in the document before we look ids up

  const sum = head.querySelector('.sum');
  // Blank while the card is open — the rows below already show every value.
  const setSummary = () => { sum.textContent = card.classList.contains('open') ? '' : summary(sec); };

  // header affordance: a switch for the optional sections, a chevron otherwise
  let sw = null;
  if (sec.toggle) {
    sw = document.createElement('button');
    sw.className = 'sw' + (S[sec.toggle] ? ' on' : '');
    sw.setAttribute('aria-label', sec.title);
    sw.addEventListener('click', (e) => {
      e.stopPropagation();
      S[sec.toggle] = !S[sec.toggle];
      sw.classList.toggle('on', S[sec.toggle]);
      card.classList.toggle('open', S[sec.toggle]);
      setSummary();
      schedule();
    });
    head.appendChild(sw);
  } else {
    const chev = document.createElement('span');
    chev.className = 'chev';
    head.appendChild(chev);
  }

  head.addEventListener('click', () => {
    if (sec.toggle && !S[sec.toggle]) return;   // nothing to show while it's off
    card.classList.toggle('open');
    setSummary();
  });

  const rowsByKey = [];
  sec.fields.forEach((key) => {
    const [label, min, max, step] = FIELDS[key];
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML =
      '<label></label>' +
      '<input type="range" min="' + min + '" max="' + max + '" step="' + step + '">' +
      '<span class="valbox"></span>';
    const lab = row.querySelector('label');
    lab.textContent = label;
    const input = row.querySelector('input');
    const box = row.querySelector('.valbox');
    const sync = () => {
      input.value = S[key];
      box.textContent = fmt(key);
      const pct = ((S[key] - min) / (max - min)) * 100;
      input.style.backgroundImage =
        'linear-gradient(90deg,var(--action) 0%,var(--action) ' + pct + '%,var(--track) ' + pct + '%,var(--track) 100%)';
      setSummary();
    };
    input.addEventListener('input', () => { S[key] = parseFloat(input.value); sync(); schedule(); });
    rows.appendChild(row);
    rowsByKey.push([key, row, lab]);
    syncs.push(sync);
    sync();
  });

  let palBlock = null;
  if (sec.palette) palBlock = buildPalette(rows, setSummary);
  if (sec.output) buildOutput(rows, setSummary);

  // A card whose every control is hidden disappears rather than sitting empty.
  const applyVis = () => {
    let live = sec.output === true;
    title.textContent = titleOf(sec);
    for (const [key, row, lab] of rowsByKey) {
      const h = isHidden(key);
      row.style.display = h ? 'none' : '';
      lab.textContent = labelOf(key);
      if (!h) live = true;
    }
    if (palBlock) {
      const h = isHidden('palette');
      palBlock.style.display = h ? 'none' : '';
      if (!h) live = true;
    }
    card.style.display = live ? '' : 'none';
  };

  syncs.push(() => {
    if (sw) { sw.classList.toggle('on', S[sec.toggle]); card.classList.toggle('open', S[sec.toggle]); }
    applyVis();
    setSummary();
  });
  applyVis();
  setSummary();
});

// ---------------------------------------------------------------- palette

function buildPalette(rows, setSummary) {
  const block = document.createElement('div');
  block.className = 'palblock';
  const head = document.createElement('div');
  head.className = 'palhead';
  head.innerHTML = '<span class="t">Holo colours</span><span class="n"></span>';
  const chips = document.createElement('div');
  chips.className = 'chips';
  chips.id = 'swatches';

  const autoRow = document.createElement('div');
  autoRow.innerHTML = '<label class="check"><input type="checkbox" id="holoAuto">Auto spectrum instead</label>';
  const autoBox = autoRow.querySelector('input');

  block.appendChild(head);
  block.appendChild(chips);
  block.appendChild(autoRow);
  rows.appendChild(block);

  const count = head.querySelector('.n');

  paintPalette = () => {
    autoBox.checked = S.holoAuto;
    chips.classList.toggle('auto', S.holoAuto);
    count.textContent = S.holoColors.length + ' / ' + PAL_MAX;
    chips.innerHTML = '';

    S.holoColors.forEach((hex, i) => {
      const chip = document.createElement('div');
      chip.className = 'chip';

      const well = document.createElement('div');
      well.className = 'well';
      const fill = document.createElement('div');
      fill.className = 'fillcol';
      fill.style.background = hex;
      well.appendChild(fill);

      const pick = document.createElement('input');
      pick.type = 'color';
      pick.value = hex;
      pick.title = 'Holo colour ' + (i + 1);
      pick.addEventListener('input', () => {
        S.holoColors[i] = pick.value;
        fill.style.background = pick.value;
        label.textContent = pick.value.replace('#', '').toUpperCase();
        if (S.holoAuto) { S.holoAuto = false; paintPalette(); }   // picking implies manual
        schedule();
      });
      well.appendChild(pick);

      if (S.holoColors.length > 1) {
        const kill = document.createElement('button');
        kill.className = 'kill';          // the cross itself is CSS, see .kill
        kill.title = 'Remove this colour';
        kill.setAttribute('aria-label', 'Remove ' + hex.replace('#', '').toUpperCase());
        kill.addEventListener('click', (e) => {
          e.stopPropagation();
          S.holoColors.splice(i, 1);
          paintPalette(); setSummary(); schedule();
        });
        well.appendChild(kill);
      }

      const label = document.createElement('span');
      label.className = 'hex';
      label.textContent = hex.replace('#', '').toUpperCase();

      chip.appendChild(well);
      chip.appendChild(label);
      chips.appendChild(chip);
    });

    const add = document.createElement('div');
    add.className = 'chip add' + (S.holoColors.length >= PAL_MAX ? ' full' : '');
    add.innerHTML = '<div class="well">+</div><span class="hex">Add</span>';
    add.addEventListener('click', () => {
      if (S.holoColors.length >= PAL_MAX) return;
      const spare = SPARE_PAL.concat(DEFAULT_PAL).find((c) => S.holoColors.indexOf(c) < 0);
      S.holoColors.push(spare || '#ffffff');
      S.holoAuto = false;
      paintPalette(); setSummary(); schedule();
    });
    chips.appendChild(add);
  };

  autoBox.addEventListener('change', () => { S.holoAuto = autoBox.checked; paintPalette(); schedule(); });
  syncs.push(() => paintPalette());
  paintPalette();
  return block;
}

// ---------------------------------------------------------------- output

function buildOutput(rows, setSummary) {
  // Size scales the placed sticker on canvas; Resolution is how many pixels
  // are rendered into it. Effective sharpness is exportScale / outScale, so
  // the row warns once scaling outruns the render.
  const sizeRow = document.createElement('div');
  sizeRow.className = 'row';
  sizeRow.innerHTML =
    '<label>Size</label>' +
    '<input type="range" min="0.25" max="3" step="0.05">' +
    '<span class="valbox"></span>';
  const sizeInput = sizeRow.querySelector('input');
  const sizeBox = sizeRow.querySelector('.valbox');
  // Kept free of paintOutput so paintOutput can call it without recursing.
  const syncSize = () => {
    sizeInput.value = S.outScale;
    sizeBox.textContent = pct();
    const p = ((S.outScale - 0.25) / (3 - 0.25)) * 100;
    sizeInput.style.backgroundImage =
      'linear-gradient(90deg,var(--action) 0%,var(--action) ' + p + '%,var(--track) ' + p + '%,var(--track) 100%)';
  };
  sizeInput.addEventListener('input', () => {
    S.outScale = parseFloat(sizeInput.value);
    syncSize(); setSummary(); paintOutput();
  });
  rows.appendChild(sizeRow);
  syncSize();

  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = '<label>Resolution</label><div class="segsm"></div>';
  const seg = row.querySelector('.segsm');
  [2, 3, 4].forEach((n) => {
    const b = document.createElement('button');
    b.textContent = n + 'x';
    b.dataset.scale = n;
    b.addEventListener('click', () => {
      S.exportScale = n;
      paintOutput(); setSummary();
      post({ type: 'request-source', scale: S.exportScale, pad: padPx() });
    });
    seg.appendChild(b);
  });

  const note = document.createElement('div');
  note.className = 'note';
  note.id = 'scaleNote';

  const keepRow = document.createElement('div');
  keepRow.innerHTML = '<label class="check"><input type="checkbox" id="keep">Keep the original layer</label>';
  const keep = keepRow.querySelector('input');

  rows.appendChild(row);
  rows.appendChild(note);
  rows.appendChild(keepRow);

  keep.checked = S.keepOriginal;
  keep.addEventListener('change', () => { S.keepOriginal = keep.checked; setSummary(); });

  paintOutput = () => {
    [...seg.children].forEach((b) => b.classList.toggle('on', +b.dataset.scale === S.exportScale));
    keep.checked = S.keepOriginal;
    syncSize();
    const density = S.exportScale / S.outScale;
    note.textContent = density < 1
      ? 'Soft at this size. Raise Resolution to ' + Math.ceil(S.outScale) + 'x or higher.'
      : '';
    note.style.display = note.textContent ? 'block' : 'none';
  };
  syncs.push(() => { paintOutput(); });
  paintOutput();
}

// ---------------------------------------------------------------- presets

const tabs = $('preset');
PRESETS.forEach((p, i) => {
  const b = document.createElement('button');
  b.textContent = p.name;
  b.dataset.preset = i;
  b.className = i === S.preset ? 'on' : '';
  tabs.appendChild(b);
});
tabs.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  [...tabs.children].forEach((x) => x.classList.toggle('on', x === b));
  S.preset = +b.dataset.preset;
  Object.assign(S, PRESETS[S.preset]);   // the palette is deliberately not in PRESETS
  syncs.forEach((f) => f());
  schedule();
});

$('shuffle').addEventListener('click', () => { S.seed = Math.random() * 97; schedule(); });
$('reset').addEventListener('click', () => {
  Object.assign(S, freshState());
  [...tabs.children].forEach((x, i) => x.classList.toggle('on', i === S.preset));
  syncs.forEach((f) => f());
  schedule();
});

// ---------------------------------------------------------------- rendering

function padPx() {
  let p = 6;
  if (S.border) p += S.borderW;
  if (S.shadow) p += S.shadowBlur + Math.max(Math.abs(S.shadowX), Math.abs(S.shadowY));
  return Math.ceil(p);
}

function hexRGB(hex) {
  const n = parseInt(hex.replace('#', ''), 16);
  return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
}

function opts() {
  return Object.assign({}, S, {
    pad: padPx(), exportScale: srcScale,
    holoN: S.holoColors.length,
    holoPal: S.holoColors.map(hexRGB)
  });
}

function schedule() {
  if (!bitmap || !renderer) return;
  dirty = true;
  if (pending) return;
  pending = true;
  requestAnimationFrame(() => {
    pending = false;
    if (dirty) { dirty = false; drawPreview(); }
  });
}

function drawPreview() {
  const o = opts();
  const fullW = bitmap.width + Math.ceil(o.pad * srcScale) * 2;
  const fullH = bitmap.height + Math.ceil(o.pad * srcScale) * 2;
  const k = Math.min(1, 720 / Math.max(fullW, fullH));
  const r = renderer.render(o, k);
  preview.width = r.width;
  preview.height = r.height;
  pctx.clearRect(0, 0, r.width, r.height);
  pctx.drawImage(glCanvas, 0, 0);
  preview.style.display = 'block';
  $('hint').style.display = 'none';
}

function toPng() {
  return new Promise((res, rej) => {
    glCanvas.toBlob((b) => {
      if (!b) return rej(new Error('Could not encode the image.'));
      b.arrayBuffer().then((ab) => res(new Uint8Array(ab)), rej);
    }, 'image/png');
  });
}

// ---------------------------------------------------------------- messaging

function post(m) { parent.postMessage({ pluginMessage: m }, '*'); }

function toU8(v) {
  if (v instanceof Uint8Array) return v;
  if (Array.isArray(v)) return new Uint8Array(v);
  return new Uint8Array(Object.keys(v).map((k) => v[k]));
}

const CREDIT = 'Vibe Coded by <a href="https://rikkijanae.com" target="_blank" rel="noopener">Rikki Janae</a>';
function setMeta(text) { $('meta').innerHTML = text ? text : CREDIT; }
function showError(m) { const e = $('err'); e.textContent = m; e.style.display = 'block'; }
function clearError() { $('err').style.display = 'none'; }

async function loadSource(msg) {
  const blob = new Blob([toU8(msg.bytes)], { type: 'image/png' });
  bitmap = await createImageBitmap(blob);
  renderer.setSource(bitmap);
  nodeId = msg.nodeId;
  srcScale = msg.scale;
}

$('apply').addEventListener('click', () => {
  if (!renderer) return;
  batch = { i: 0, total: 1 };
  $('apply').disabled = true;
  setMeta('Rendering…');
  post({ type: 'request-batch', index: 0, scale: S.exportScale, pad: padPx() });
});

onmessage = async (event) => {
  const msg = event.data.pluginMessage;
  if (!msg) return;

  if (msg.type === 'no-selection') {
    bitmap = null; nodeId = null;
    preview.style.display = 'none';
    $('hint').style.display = 'block';
    $('hint').textContent = 'Select a layer on the canvas';
    $('apply').disabled = true;
    setMeta('');
    return;
  }

  if (msg.type === 'selection-changed') {
    // Figma fires this on every click; coalesce so a quick scrub through the
    // layers doesn't queue an export for each one.
    clearTimeout(selTimer);
    selTimer = setTimeout(() => {
      if (!batch) post({ type: 'request-source', scale: S.exportScale, pad: padPx() });
    }, 120);
    return;
  }

  if (msg.type === 'source') {
    clearError();
    await loadSource(msg);
    $('apply').disabled = false;
    // The credit line stays put; only transient status replaces it.
    setMeta(msg.scale < msg.requestedScale ? 'Capped to ' + msg.scale + 'x' : '');
    schedule();
    return;
  }

  if (msg.type === 'batch-source') {
    batch = { i: msg.index, total: msg.total };
    setMeta('Rendering ' + (msg.index + 1) + '/' + msg.total + '…');
    await loadSource(msg);
    const o = opts();
    const r = renderer.render(o, 1);
    const bytes = await toPng();
    post({
      type: 'result',
      bytes: bytes,
      nodeId: msg.nodeId,
      scale: r.scale,
      pad: r.padOut,
      keepOriginal: S.keepOriginal,
      outScale: S.outScale,
      index: msg.index,
      total: msg.total
    });
    return;
  }

  if (msg.type === 'placed' || msg.type === 'skip') {
    post({ type: 'request-batch', index: msg.index + 1, scale: S.exportScale, pad: padPx() });
    return;
  }

  if (msg.type === 'done') {
    batch = null;
    $('apply').disabled = false;
    setMeta('Done');
    setTimeout(() => { if (!batch) setMeta(''); }, 1600);
    // The new image is now selected, which triggers a fresh preview.
    return;
  }

  if (msg.type === 'error') showError(msg.message);
};

setMeta('');
post({ type: 'ready', scale: S.exportScale, pad: padPx() });

</script>
